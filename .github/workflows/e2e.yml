name: E2E

# Reusable Playwright run against the real stack: backend jar + PostgreSQL +
# the production frontend build, on a desktop and a phone-sized browser. Called
# by ci.yml (PR gate, 5 resume cycles) and nightly.yml (20 resume cycles and the
# mobile performance budget, P-38), see P-36.
on:
  workflow_call:
    inputs:
      resume-cycles:
        type: string
        default: '5'
      perf:
        description: Also run the mobile performance budget (perf.spec.ts)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # the perf run reads the last good nightly's artifact

jobs:
  e2e:
    name: Playwright (resume x${{ inputs.resume-cycles }}${{ inputs.perf && ', perf' || '' }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shardbound
          POSTGRES_USER: shardbound
          POSTGRES_PASSWORD: ci-only-password   # throwaway CI container, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shardbound -d shardbound"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DB_URL: jdbc:postgresql://localhost:5432/shardbound
      E2E_DB_USER: shardbound
      E2E_DB_PASSWORD: ci-only-password
      RESUME_CYCLES: ${{ inputs.resume-cycles }}
      PERF: ${{ inputs.perf && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Build the backend jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix frontend ci
          npx playwright install --with-deps chromium
      # P-38: compare with the numbers of the last successful nightly run, when there is one.
      - name: Download the last good nightly's performance numbers
        if: inputs.perf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name perf-numbers --dir e2e/perf/baseline; then
            echo "Baseline from nightly run $run_id:"; cat e2e/perf/baseline/perf.json
          else
            echo "::notice::No earlier successful nightly with performance numbers; checking the absolute budget only."
          fi
      - name: Playwright
        run: npx playwright test -c e2e
      - name: Keep this run's performance numbers
        if: always() && inputs.perf
        uses: actions/upload-artifact@v4
        with:
          name: perf-numbers
          path: e2e/perf/perf.json
          if-no-files-found: warn
          retention-days: 90
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
