name: E2E

# Reusable Playwright run against the real stack: backend jar + PostgreSQL +
# the production frontend build. Called by ci.yml (PR gate, 5 resume cycles)
# and nightly.yml (20 resume cycles), see P-36.
on:
  workflow_call:
    inputs:
      resume-cycles:
        type: string
        default: '5'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (resume x${{ inputs.resume-cycles }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shardbound
          POSTGRES_USER: shardbound
          POSTGRES_PASSWORD: ci-only-password   # throwaway CI container, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shardbound -d shardbound"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DB_URL: jdbc:postgresql://localhost:5432/shardbound
      E2E_DB_USER: shardbound
      E2E_DB_PASSWORD: ci-only-password
      RESUME_CYCLES: ${{ inputs.resume-cycles }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Build the backend jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix frontend ci
          npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test -c e2e
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
