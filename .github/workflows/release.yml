name: Release

# release-please reads the Conventional Commits merged into main, keeps a
# release PR with the next semver version and CHANGELOG.md up to date, and
# tags the release when that PR is merged.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
