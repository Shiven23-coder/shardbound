name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit, ArchUnit, schemas, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers starts PostgreSQL 17 on the runner's Docker; no service container needed.
      - name: Build and test
        run: ./mvnw -B verify
      - name: API contract is up to date
        run: |
          if ! git diff --exit-code -- ../api/openapi.json; then
            echo "::error::api/openapi.json is out of date. Run 'mvnw test' and commit the result."
            exit 1
          fi

  frontend:
    name: Frontend (typecheck, Vitest, build, budgets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck   # generates the client from api/openapi.json first
      - run: npm test
      - run: npm run build
      # Bundle and asset budgets, and no dev-only code in the bundle (§4.13, P-36)
      - run: node ../tools/ci/check-bundle.mjs dist

  credits:
    name: CREDITS covers every asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tools/ci/check-credits.mjs

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      actions: read   # e2e.yml declares it for the nightly perf baseline; a called workflow cannot exceed its caller
    with:
      resume-cycles: '5'

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read    # the action lists the PR's commits to scan only those
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
