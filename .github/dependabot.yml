version: 2

# Weekly dependency updates. Minor and patch updates are grouped into one PR
# per ecosystem; major updates arrive one by one so they get a real review.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 5 stays for openapi-typescript, which generates the API client from api/openapi.json:
      # it needs the TypeScript 5 JavaScript API (peer typescript ^5.x), which TypeScript 7 does not have.
      # Type-checking already runs on TypeScript 7 through the separate typescript7 alias.
      # Revisit when openapi-typescript supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # The database's major version is chosen with the hosting at deploy time (P-21, P-58);
    # until then only minor and patch images of PostgreSQL 17 arrive.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
